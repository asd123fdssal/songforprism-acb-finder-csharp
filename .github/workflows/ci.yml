name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AcbFinder.slnx

      - name: Build
        run: dotnet build AcbFinder.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AcbFinder.slnx --configuration Release --no-build --verbosity normal
