name: Create Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AcbFinder.slnx

      - name: Test
        run: dotnet test AcbFinder.slnx --configuration Release --no-restore --verbosity normal

      - name: Publish application
        run: >
          dotnet publish src/AcbFinder.App/AcbFinder.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/publish

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/songforprism-acb-finder-csharp-win-x64.zip

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $asset = "artifacts/songforprism-acb-finder-csharp-win-x64.zip"

          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo ${{ github.repository }} --clobber
          }
          else {
            gh release create $tag $asset --repo ${{ github.repository }} --title $tag --generate-notes
          }
